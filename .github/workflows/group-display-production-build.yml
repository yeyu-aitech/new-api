name: Build rc.21 group display production image

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rc21-group-display-production
  cancel-in-progress: false

env:
  SOURCE_BRANCH: codex/rc.21-group-display
  SOURCE_SHA: 286c1288c557dfcef29422614210b4ac3e63a736
  BASE_SHA: bde9b2f44887d34ec54799ae191d50f97914359e
  IMAGE_REPOSITORY: yeyu-aitech/new-api
  IMAGE_TAG: v1.0.0-rc.21-group-display.1

jobs:
  verify-build-package:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      attestations: write
      id-token: write

    steps:
      - name: Check out immutable source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 2

      - name: Verify source scope
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${SOURCE_SHA}"
          test "$(git rev-parse HEAD^)" = "${BASE_SHA}"
          test "$(git diff --name-only HEAD^ HEAD)" = "web/default/src/features/keys/components/api-keys-mutate-drawer.tsx"
          test "$(git diff --numstat HEAD^ HEAD)" = $'1\t1\tweb/default/src/features/keys/components/api-keys-mutate-drawer.tsx'
          grep -Fq 'label: info.desc || key,' web/default/src/features/keys/components/api-keys-mutate-drawer.tsx
          grep -Fq 'value: key,' web/default/src/features/keys/components/api-keys-mutate-drawer.tsx
          test -z "$(git status --porcelain)"

      - name: Reject secrets and production data
        shell: bash
        run: |
          set -euo pipefail
          prohibited="$({
            git ls-files | grep -E '(^|/)(\.env($|\.)|.*\.(dump|pem|key|p12|pfx)$)' || true
          } | grep -Ev '(^|/)\.env\.example$' || true)"
          if [ -n "${prohibited}" ]; then
            printf '%s\n' "${prohibited}"
            exit 1
          fi
          grep -qxF '.git' .dockerignore
          grep -qxF '.github' .dockerignore
          grep -qxF '/web/node_modules' .dockerignore

      - name: Write immutable application version
        shell: bash
        run: printf '%s\n' "${IMAGE_TAG}" > VERSION

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.5

      - name: Install frontend dependencies
        working-directory: web
        run: bun install --frozen-lockfile

      - name: Type-check and build default frontend
        working-directory: web/default
        env:
          DISABLE_ESLINT_PLUGIN: "true"
          VITE_REACT_APP_VERSION: v1.0.0-rc.21-group-display.1
        run: |
          bun run typecheck
          bun run build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build immutable amd64 image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          tags: ${{ env.IMAGE_REPOSITORY }}:${{ env.IMAGE_TAG }}
          labels: |
            org.opencontainers.image.source=https://github.com/yeyu-aitech/new-api
            org.opencontainers.image.revision=${{ env.SOURCE_SHA }}
            org.opencontainers.image.version=${{ env.IMAGE_TAG }}
            com.tokenpowerhub.new-api.base-revision=${{ env.BASE_SHA }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-test built image
        shell: bash
        run: |
          set -euo pipefail
          container=group-display-build-smoke
          cleanup() { docker rm -f "${container}" >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          docker run -d --name "${container}" -p 127.0.0.1:3000:3000 \
            "${IMAGE_REPOSITORY}:${IMAGE_TAG}"
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3000/api/status > /tmp/status.json; then
              break
            fi
            if [ "${attempt}" = 60 ]; then
              docker logs "${container}" --tail 200
              exit 1
            fi
            sleep 2
          done
          jq -e --arg version "${IMAGE_TAG}" \
            '.success == true and .data.version == $version' /tmp/status.json
          test "$(docker inspect "${container}" --format '{{.State.Status}}')" = running
          ! docker logs "${container}" 2>&1 | grep -Eiq 'panic|fatal|migration failed|failed to initialize database'

      - name: Package exact smoke-tested image
        id: package
        shell: bash
        run: |
          set -euo pipefail
          docker image inspect "${IMAGE_REPOSITORY}:${IMAGE_TAG}" > group-display-production.image.json
          docker save "${IMAGE_REPOSITORY}:${IMAGE_TAG}" | gzip -1 > group-display-production.docker.tar.gz
          sha256sum group-display-production.docker.tar.gz group-display-production.image.json > group-display-production.release.sha256
          image_id="$(docker image inspect "${IMAGE_REPOSITORY}:${IMAGE_TAG}" --format '{{.Id}}')"
          archive_sha256="$(sha256sum group-display-production.docker.tar.gz | cut -d' ' -f1)"
          echo "image_id=${image_id}" >> "$GITHUB_OUTPUT"
          echo "archive_sha256=${archive_sha256}" >> "$GITHUB_OUTPUT"

      - name: Generate SBOM
        uses: anchore/sbom-action@a930d0ac434e3182448fe678398ba5713717112a # v0.21.0
        with:
          image: ${{ env.IMAGE_REPOSITORY }}:${{ env.IMAGE_TAG }}
          format: spdx-json
          output-file: group-display-production.spdx.json
          upload-artifact: false

      - name: Attest release manifest
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3.0.0
        with:
          subject-path: group-display-production.release.sha256

      - name: Upload offline production artifact
        uses: actions/upload-artifact@v4
        with:
          name: new-api-v1.0.0-rc.21-group-display.1-linux-amd64
          path: |
            group-display-production.docker.tar.gz
            group-display-production.image.json
            group-display-production.release.sha256
            group-display-production.spdx.json
          if-no-files-found: error
          retention-days: 90
          compression-level: 0

      - name: Publish build summary
        shell: bash
        env:
          IMAGE_ID: ${{ steps.package.outputs.image_id }}
          ARCHIVE_SHA256: ${{ steps.package.outputs.archive_sha256 }}
        run: |
          {
            echo '## rc.21 group display production image'
            echo
            echo "- Source commit: \`${SOURCE_SHA}\`"
            echo "- rc.21 baseline: \`${BASE_SHA}\`"
            echo "- Image: \`${IMAGE_REPOSITORY}:${IMAGE_TAG}\`"
            echo "- Docker image ID: \`${IMAGE_ID}\`"
            echo "- Artifact SHA-256: \`${ARCHIVE_SHA256}\`"
            echo '- Distribution: GitHub Actions artifact only'
          } >> "$GITHUB_STEP_SUMMARY"
